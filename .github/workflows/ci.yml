name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: extractions/setup-just@v3
      - run: just install
      - run: just test
      - run: just check
      - run: just build

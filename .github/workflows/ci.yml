name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@v3
      - uses: extractions/setup-just@v3
      - run: cd backend && uv sync --group dev
      - run: cd frontend && aube ci
      - run: just test
      - run: just check
      - run: just build
